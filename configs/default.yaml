# Default experiment configuration.
# Change store_id / dept_id to rerun the whole study on another slice of M5.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  store_id: CA_3        # one of CA_1..4, TX_1..3, WI_1..3
  dept_id: FOODS_3      # 823 SKUs, the largest department in M5
  start_date: "2013-01-01"

backtest:
  horizon: 28           # forecast 4 weeks ahead (same as the M5 competition)
  n_folds: 3            # rolling-origin evaluation windows
  step: 28              # days between fold cutoffs

models:
  season_length: 7      # weekly seasonality
  stats_train_days: 730 # history given to the per-series statistical models
  lightgbm:
    objective: tweedie
    tweedie_variance_power: 1.1
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 0.1
    n_estimators: 700
    verbose: -1
    seed: 42
  ensemble_members: [AutoETS, AutoARIMA, LightGBM]

inventory:
  lead_time_days: 3
  review_period_days: 7
  service_levels: [0.70, 0.80, 0.85, 0.90, 0.95, 0.975, 0.99]
  target_fill_rate: 0.95
  holding_cost_rate_annual: 0.25   # cost of capital + storage + shrink, % of unit value per year
  gross_margin: 0.30               # lost-sale cost = margin x price

output:
  reports_dir: reports
  figures_dir: reports/figures
